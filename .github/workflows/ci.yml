name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with 100% Coverage
        run: |
          pytest --cov=target --cov-branch --cov-fail-under=100

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: .coverage

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Webhook Deploy
        run: |
          curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

  smoke-test:
    name: Smoke Test Live Site
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployment propagation
        run: sleep 15

      - name: Check Live Health Endpoint & SHA
        run: |
          LIVE_URL="https://your-app-name.onrender.com"
          
          # Health check and live endpoint checks
          curl -f "$LIVE_URL/" || exit 1
          curl -f "$LIVE_URL/health" || exit 1